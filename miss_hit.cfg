# MISS_HIT configuration for this repo.
# Docs: https://florianschanda.github.io/miss_hit/

# Marks this directory as the project root so the tools resolve paths and apply
# these settings to every .m file underneath it.
project_root

# Tool help blocks run wide (longest line is ~106); keep the style limit above
# that so the advisory style pass does not drown real findings in noise.
line_length: 120
