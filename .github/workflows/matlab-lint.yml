name: MATLAB lint

# Static checks for every .m file in the repo. Uses MISS_HIT
# (https://florianschanda.github.io/miss_hit/), a pure-Python MATLAB/Octave
# code analyzer, so no MATLAB license or self-hosted runner is needed.

on:
  push:
    paths:
      - '**/*.m'
      - miss_hit.cfg
      - .github/workflows/matlab-lint.yml
  pull_request:
    paths:
      - '**/*.m'
      - miss_hit.cfg
      - .github/workflows/matlab-lint.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Unpinned to track fixes; pin a version here if a release ever regresses.
      - name: Install MISS_HIT
        run: pip install miss_hit

      # Gate: parses every .m file and reports likely bugs. A syntax error or a
      # lint finding makes this step exit non-zero and fails the build.
      - name: Lint (syntax + bug checks)
        run: mh_lint .

      # Advisory: formatting/style. Reported in the log, never blocks a merge.
      # `|| true` keeps the step green so it does not raise a red annotation.
      - name: Style (advisory)
        if: always()
        run: mh_style . || true

      # Advisory: cyclomatic complexity and other code metrics.
      - name: Complexity metrics (advisory)
        if: always()
        run: mh_metric . || true
